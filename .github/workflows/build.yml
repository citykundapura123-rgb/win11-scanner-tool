name: Build Windows Scanner App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish x64 App
      run: dotnet publish Win11ScannerApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o output

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Win11ScannerTool
        path: output/Win11ScannerApp.exe
